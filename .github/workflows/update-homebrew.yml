name: Update AutomatosX Formula

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to update to (for example, 13.4.9)"
        required: true
        type: string
  repository_dispatch:
    types: [npm-publish]

concurrency:
  group: homebrew-tap-automatosx
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update-formula:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out tap
        uses: actions/checkout@v7
        with:
          persist-credentials: true

      - name: Determine version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          DISPATCH_VERSION: ${{ github.event.client_payload.version }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_VERSION}" ]; then
            VERSION="${INPUT_VERSION}"
          elif [ -n "${DISPATCH_VERSION}" ]; then
            VERSION="${DISPATCH_VERSION}"
          else
            VERSION="$(curl --fail --silent --show-error \
              https://registry.npmjs.org/@defai.digital/cli/latest | jq -r '.version')"
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid AutomatosX version: $VERSION"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Calculate package checksum
        id: sha256
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          SHA256="$(curl --fail --silent --show-error --location \
            "https://registry.npmjs.org/@defai.digital/cli/-/cli-${VERSION}.tgz" |
            sha256sum | awk '{print $1}')"
          if [[ ! "$SHA256" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::Invalid SHA256: $SHA256"
            exit 1
          fi
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"

      - name: Update formula
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SHA256: ${{ steps.sha256.outputs.sha256 }}
        run: |
          set -euo pipefail
          sed -i \
            -e "s|cli-[0-9A-Za-z.-]*\\.tgz|cli-${VERSION}.tgz|g" \
            -e "s|sha256 \"[a-f0-9]*\"|sha256 \"${SHA256}\"|g" \
            Formula/ax.rb
          grep -qF "cli-${VERSION}.tgz" Formula/ax.rb
          grep -qF "sha256 \"${SHA256}\"" Formula/ax.rb
          ruby -c Formula/ax.rb

      - name: Commit and push
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/ax.rb
          if git diff --cached --quiet; then
            echo "Formula is already current."
            exit 0
          fi
          git commit -m "Update ax formula to v${VERSION}"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "::warning::Push attempt ${attempt} failed; retrying."
            sleep $((attempt * 2))
          done
          echo "::error::Could not update Formula/ax.rb after five attempts."
          exit 1
